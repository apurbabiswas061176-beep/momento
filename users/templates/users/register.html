<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join Momento</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; display: flex; justify-content: center; padding-top: 50px; margin: 0; }
        .box { background: #fff; border: 1px solid #dbdbdb; border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; text-align: center; }
        .logo { font-size: 32px; font-weight: 800; background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        form { text-align: left; font-size: 14px; }
        .helptext, ul { font-size: 11px; color: #8e8e8e; padding-left: 16px; }
        input { width: 100%; padding: 10px; margin-top: 4px; margin-bottom: 12px; border: 1px solid #dbdbdb; border-radius: 8px; box-sizing: border-box; background: #fafafa; }
        button { width: 100%; background: #0095f6; color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 8px; }
        a { color: #0095f6; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">Momento</div>
        <p style="color:#8e8e8e; font-size:14px; margin-top:0; margin-bottom:20px;">Sign up to see photos from friends around the world.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Account</button>
        </form>
        <p style="font-size:14px; margin-top:20px;">Already have an account? <a href="/login/">Log in</a></p>
    </div>
</body>
</html>
