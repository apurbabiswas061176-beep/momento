<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover People - Momento</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; margin: 0; color: #262626; }
        nav { background: #fff; border-bottom: 1px solid #dbdbdb; position: sticky; top: 0; z-index: 10; }
        .nav-inner { max-width: 600px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; text-decoration: none; background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { max-width: 500px; margin: 24px auto; padding: 0 16px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 10px 14px; border: 1px solid #dbdbdb; border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
        .btn-blue { background: #0095f6; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 14px; }
        .user-card { background: #fff; border: 1px solid #dbdbdb; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">Momento</a>
            <div style="display:flex; gap:14px; align-items:center;">
                <a href="/" style="text-decoration:none; color:#262626; font-weight:600; font-size:14px;">Home Feed</a>
                <a href="/profile/{{ request.user.username }}/" style="text-decoration:none; color:#262626; font-weight:600; font-size:14px;">@{{ request.user.username }}</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <form method="get" class="search-box">
            <input type="text" name="q" value="{{ query }}" placeholder="Search users globally...">
            <button type="submit" class="btn-blue">Search</button>
        </form>
        <h3 style="font-size:14px; color:#8e8e8e; margin-bottom:12px;">
            {% if query %}Results for "{{ query }}"{% else %}Discover People on Momento{% endif %}
        </h3>
        {% for u in users %}
        <div class="user-card">
            <div>
                <a href="/profile/{{ u.username }}/" style="font-weight:700; color:#262626; text-decoration:none;">@{{ u.username }}</a>
                <div style="font-size:12px; color:#8e8e8e;">{{ u.bio|truncatechars:50|default:"Momento member" }}</div>
            </div>
            <a href="/profile/{{ u.username }}/" class="btn-blue">View Profile</a>
        </div>
        {% empty %}
        <p style="text-align:center; color:#8e8e8e; padding:30px;">No users found.</p>
        {% endfor %}
    </div>
</body>
</html>
